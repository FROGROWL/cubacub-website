<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Civic-Flow — System Architecture Canvas</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d1117; overflow:hidden; font-family:'Inter',sans-serif; color:#fff; width:100vw; height:100vh; cursor:grab; user-select:none; }
body.dragging { cursor:grabbing; }

/* TOOLBAR */
#toolbar { position:fixed; top:0; left:0; right:0; height:52px; background:rgba(22,27,34,.95); backdrop-filter:blur(12px); border-bottom:1px solid rgba(255,255,255,.08); display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:100; }
#toolbar .left { display:flex; align-items:center; gap:12px; }
#toolbar .logo { font-family:'Montserrat',sans-serif; font-size:14px; font-weight:600; }
#toolbar .logo span { color:#008080; }
#toolbar .sep { width:1px; height:20px; background:rgba(255,255,255,.1); }
#toolbar .subtitle { font-size:12px; color:rgba(255,255,255,.4); }
#toolbar .right { display:flex; align-items:center; gap:6px; }
#toolbar button { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); color:rgba(255,255,255,.6); border-radius:8px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; transition:all .15s; }
#toolbar button:hover { background:rgba(255,255,255,.1); color:#fff; }
#toolbar .zoom-text { font-size:11px; color:rgba(255,255,255,.35); margin-right:4px; font-variant-numeric:tabular-nums; min-width:36px; text-align:right; }

/* CANVAS */
#canvas-wrap { position:absolute; top:52px; left:0; right:0; bottom:0; overflow:hidden; }
#canvas { position:absolute; transform-origin:0 0; will-change:transform; }

/* DOT GRID */
#canvas-wrap::before { content:''; position:absolute; inset:0; background-image:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px); background-size:24px 24px; z-index:0; pointer-events:none; }

/* FRAME */
.frame { position:absolute; border-radius:8px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.06); transition:box-shadow .2s, transform .2s; }
.frame:hover { box-shadow:0 8px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.12); transform:scale(1.01); z-index:10; }

/* FRAME TITLE BAR */
.frame-title { height:28px; display:flex; align-items:center; padding:0 10px; gap:6px; font-size:10px; font-family:'Montserrat',sans-serif; font-weight:600; letter-spacing:.02em; }
.frame-title .dots { display:flex; gap:4px; }
.frame-title .dot { width:7px; height:7px; border-radius:50%; }
.frame-title .route { margin-left:auto; font-size:9px; opacity:.5; font-family:'Inter',sans-serif; font-weight:400; }

/* FRAME CONTENT */
.frame-body { background:#fff; color:#1a1a2e; overflow:hidden; position:relative; }

/* GROUP BOX */
.group-box { position:absolute; border-radius:16px; border:1.5px dashed; pointer-events:none; }
.group-label { position:absolute; font-size:13px; font-family:'Montserrat',sans-serif; font-weight:600; padding:4px 12px; border-radius:8px; white-space:nowrap; }

/* SVG NOODLES */
#noodles { position:absolute; top:0; left:0; pointer-events:none; z-index:5; overflow:visible; }
#noodles path { fill:none; transition:opacity .3s; }
#noodles .noodle-label { font-family:'Inter',sans-serif; font-size:9px; font-weight:500; }

/* LEGEND */
#legend { position:fixed; bottom:16px; left:16px; background:rgba(22,27,34,.92); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:14px 18px; z-index:100; }
#legend h4 { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:rgba(255,255,255,.3); margin-bottom:8px; font-family:'Montserrat',sans-serif; }
#legend .row { display:flex; align-items:center; gap:8px; margin-bottom:5px; font-size:10px; color:rgba(255,255,255,.55); }
#legend .swatch { width:14px; height:14px; border-radius:4px; border:1.5px dashed; flex-shrink:0; }
#legend .line-sample { width:20px; height:0; flex-shrink:0; }

/* HELP */
#help { position:fixed; bottom:16px; right:16px; font-size:10px; color:rgba(255,255,255,.18); z-index:100; }

/* --- Mini UI Components Inside Frames --- */
.mini-nav { height:22px; background:linear-gradient(90deg,#1B263B,#2d4a6e); display:flex; align-items:center; padding:0 8px; gap:5px; }
.mini-nav .nav-dot { width:4px; height:4px; border-radius:2px; background:rgba(255,255,255,.3); }
.mini-nav .nav-logo { width:10px; height:10px; border-radius:3px; background:rgba(0,128,128,.7); }

.mini-card { background:#f5f7fa; border-radius:4px; padding:4px 6px; margin:2px; }
.mini-card-sm { width:40px; height:24px; background:#f5f7fa; border-radius:3px; }
.mini-btn { display:inline-block; padding:2px 6px; border-radius:3px; font-size:6px; color:#fff; }
.mini-input { width:100%; height:8px; background:#f0f2f5; border-radius:2px; margin:2px 0; }
.mini-avatar { width:12px; height:12px; border-radius:50%; }
.mini-bar { border-radius:1px; }
.mini-pill { display:inline-block; padding:1px 4px; border-radius:2px; font-size:5px; margin:1px; }
.mini-text { height:3px; background:#e0e0e0; border-radius:1px; margin:2px 0; }
.mini-text.short { width:60%; }
.mini-text.med { width:80%; }
.mini-heading { height:5px; background:#1B263B; border-radius:1px; margin:3px 0; width:50%; }

.mini-sidebar { width:42px; background:linear-gradient(180deg,#1B263B,#2d4a6e); position:absolute; left:0; top:0; bottom:0; display:flex; flex-direction:column; align-items:center; padding-top:10px; gap:6px; }
.mini-sidebar .sb-item { width:20px; height:6px; border-radius:2px; background:rgba(255,255,255,.15); }
.mini-sidebar .sb-item.active { background:rgba(0,128,128,.7); }

.mini-table-row { display:flex; gap:3px; padding:2px 4px; border-bottom:1px solid #f0f2f5; align-items:center; }
.mini-table-cell { height:4px; border-radius:1px; background:#e0e0e0; }

.mini-stat { background:#fff; border-radius:4px; border:1px solid #f0f2f5; padding:4px 6px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.04); }
.mini-stat .val { font-size:8px; font-weight:700; color:#1B263B; }
.mini-stat .lbl { font-size:4px; color:#999; margin-top:1px; }

/* PIE */
.mini-donut { position:relative; }
</style>
</head>
<body>

<div id="toolbar">
  <div class="left">
    <div class="logo"><span>Civic-Flow</span> Canvas</div>
    <div class="sep"></div>
    <div class="subtitle">Barangay Cubacub — Full System Architecture</div>
  </div>
  <div class="right">
    <span class="zoom-text" id="zoom-label">72%</span>
    <button onclick="zoomIn()" title="Zoom In">+</button>
    <button onclick="zoomOut()" title="Zoom Out">−</button>
    <button onclick="resetView()" title="Reset View">⊡</button>
    <button onclick="fitAll()" title="Fit All">⊞</button>
  </div>
</div>

<div id="canvas-wrap">
  <svg id="noodles" width="6000" height="4000"></svg>
  <div id="canvas"></div>
</div>

<div id="legend">
  <h4>Legend</h4>
  <div class="row"><div class="swatch" style="background:rgba(0,128,128,.08);border-color:#008080"></div> Public Pages</div>
  <div class="row"><div class="swatch" style="background:rgba(124,58,237,.08);border-color:#7C3AED"></div> Authentication</div>
  <div class="row"><div class="swatch" style="background:rgba(27,38,59,.1);border-color:#1B263B"></div> Staff Dashboards</div>
  <div class="row"><div class="swatch" style="background:rgba(71,85,105,.08);border-color:#64748b"></div> Shared Services</div>
  <div class="row" style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.06)">
    <div class="line-sample" style="border-top:2px solid rgba(255,255,255,.35)"></div> Direct Flow
  </div>
  <div class="row">
    <div class="line-sample" style="border-top:2px dashed rgba(255,255,255,.35)"></div> Data Flow
  </div>
</div>

<div id="help">Scroll to zoom &middot; Drag to pan &middot; Hover frames for details</div>

<script>
// ============= STATE =============
let zoom = 0.55, panX = 80, panY = 30;
let dragging = false, startX = 0, startY = 0;

const canvas = document.getElementById('canvas');
const wrap = document.getElementById('canvas-wrap');
const noodles = document.getElementById('noodles');

function updateTransform() {
  canvas.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
  noodles.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
  document.getElementById('zoom-label').textContent = Math.round(zoom*100)+'%';
}

wrap.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.max(.2, Math.min(2.5, zoom + (e.deltaY>0?-.04:.04))); updateTransform(); }, {passive:false});
wrap.addEventListener('mousedown', e => { if(e.target===wrap||e.target===wrap.querySelector('::before')||e.target.tagName==='svg'||e.target.id==='canvas-wrap') { dragging=true; startX=e.clientX-panX; startY=e.clientY-panY; document.body.classList.add('dragging'); }});
window.addEventListener('mousemove', e => { if(dragging) { panX=e.clientX-startX; panY=e.clientY-startY; updateTransform(); }});
window.addEventListener('mouseup', () => { dragging=false; document.body.classList.remove('dragging'); });

function zoomIn() { zoom=Math.min(2.5,zoom+.1); updateTransform(); }
function zoomOut() { zoom=Math.max(.2,zoom-.1); updateTransform(); }
function resetView() { zoom=.55; panX=80; panY=30; updateTransform(); }
function fitAll() { zoom=.42; panX=60; panY=20; updateTransform(); }

// ============= FRAMES =============
const frames = [
  // ---- PUBLIC ----
  { id:'landing', x:60, y:80, w:380, h:300, title:'Landing Page', route:'/', titleBg:'linear-gradient(90deg,#1B263B,#008080)', group:'public' },
  { id:'doc-form', x:60, y:440, w:380, h:320, title:'Document Request — 5 Step Form', route:'/ (modal)', titleBg:'linear-gradient(90deg,#1B263B,#3b82f6)', group:'public' },
  { id:'claim-slip', x:60, y:820, w:260, h:200, title:'Printable Claim Slip', route:'(print)', titleBg:'linear-gradient(90deg,#1B263B,#10b981)', group:'public' },
  { id:'doc-catalog', x:300, y:820, w:200, h:220, title:'Document Catalog', route:'9 types', titleBg:'linear-gradient(90deg,#0f172a,#3b82f6)', group:'public' },
  { id:'clinic-booking', x:500, y:80, w:340, h:280, title:'Clinic Booking Form', route:'/ (modal)', titleBg:'linear-gradient(90deg,#006666,#008080)', group:'public' },
  { id:'clinic-invoice', x:500, y:420, w:260, h:180, title:'Appointment Invoice', route:'(print)', titleBg:'linear-gradient(90deg,#008080,#10b981)', group:'public' },
  { id:'report-submit', x:500, y:660, w:300, h:220, title:'Report / Complaint Form', route:'/ (modal)', titleBg:'linear-gradient(90deg,#92400e,#f59e0b)', group:'public' },
  { id:'finance', x:560, y:920, w:360, h:280, title:'Finance Transparency Page', route:'/finance', titleBg:'linear-gradient(90deg,#047857,#34d399)', group:'public' },

  // ---- AUTH ----
  { id:'login', x:1020, y:80, w:320, h:260, title:'Staff Login Page', route:'/login', titleBg:'linear-gradient(90deg,#5b21b6,#7C3AED)', group:'auth' },
  { id:'session', x:1020, y:400, w:240, h:120, title:'Session Manager', route:'localStorage', titleBg:'linear-gradient(90deg,#6d28d9,#a78bfa)', group:'auth' },

  // ---- STAFF ----
  { id:'dashboard-shell', x:1500, y:80, w:400, h:200, title:'Dashboard Shell', route:'/dashboard', titleBg:'linear-gradient(90deg,#1e293b,#334155)', group:'staff' },
  { id:'doc-handler', x:1500, y:340, w:400, h:280, title:'Document Handler Panel', route:'Role: document_handler', titleBg:'linear-gradient(90deg,#1B263B,#3b82f6)', group:'staff' },
  { id:'report-handler', x:1960, y:340, w:400, h:300, title:'Report & Case Management', route:'Role: report_handler', titleBg:'linear-gradient(90deg,#92400e,#f59e0b)', group:'staff' },
  { id:'clinic-handler', x:1500, y:680, w:400, h:280, title:'Clinic Handler Panel', route:'Role: clinic_handler', titleBg:'linear-gradient(90deg,#006666,#14b8a6)', group:'staff' },
  { id:'treasurer', x:1960, y:700, w:400, h:280, title:'Treasurer Dashboard', route:'Role: treasurer', titleBg:'linear-gradient(90deg,#047857,#34d399)', group:'staff' },
  { id:'super-admin', x:1700, y:1040, w:460, h:320, title:'Super Admin Panel', route:'Role: super_admin', titleBg:'linear-gradient(90deg,#5b21b6,#a78bfa)', group:'staff' },
];

// ============= GROUP BOXES =============
const groups = [
  { label:'Public Layer', emoji:'🌐', color:'#008080', x:30, y:35, w:910, h:1010 },
  { label:'Authentication', emoji:'🔐', color:'#7C3AED', x:990, y:35, w:400, h:510 },
  { label:'Staff Dashboards', emoji:'🏛️', color:'#475569', x:1470, y:35, w:930, h:1360 },
];

// Render group boxes
groups.forEach(g => {
  const box = document.createElement('div');
  box.className = 'group-box';
  box.style.cssText = `left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px;border-color:${g.color};background:${g.color}08;`;
  canvas.appendChild(box);
  const label = document.createElement('div');
  label.className = 'group-label';
  label.style.cssText = `left:${g.x+12}px;top:${g.y-14}px;background:#0d1117;color:${g.color};border:1px solid ${g.color}44;`;
  label.textContent = `${g.emoji} ${g.label}`;
  canvas.appendChild(label);
});

// ============= RENDER FRAMES =============
function miniNav() {
  return `<div class="mini-nav"><div class="nav-logo"></div><div class="nav-dot"></div><div class="nav-dot"></div><div class="nav-dot"></div><div class="nav-dot" style="margin-left:auto;width:16px;background:rgba(0,128,128,.5)"></div></div>`;
}

function miniSidebar(activeIdx=0, color='#1B263B') {
  let items = '';
  for(let i=0;i<5;i++) items += `<div class="sb-item ${i===activeIdx?'active':''}" style="${i===activeIdx?`background:${color}88`:''}" ></div>`;
  return `<div class="mini-sidebar" style="background:linear-gradient(180deg,${color},${color}cc)">${items}</div>`;
}

function miniTableRows(n=5) {
  let rows = '';
  for(let i=0;i<n;i++) {
    rows += `<div class="mini-table-row"><div class="mini-table-cell" style="width:${12+Math.random()*18}%;"></div><div class="mini-table-cell" style="width:${20+Math.random()*25}%;"></div><div class="mini-table-cell" style="width:${10+Math.random()*12}%;"></div><div class="mini-pill" style="background:${['#dcfce7','#fef3c7','#fee2e2','#dbeafe'][i%4]};color:${['#166534','#92400e','#991b1b','#1e40af'][i%4]}">status</div></div>`;
  }
  return rows;
}

function miniSVGDonut(cx,cy,r,segments,size=60) {
  let paths = '', startAngle = 0;
  segments.forEach(s => {
    const endAngle = startAngle + (s.pct/100)*360;
    const x1 = cx+r*Math.cos((startAngle-90)*Math.PI/180);
    const y1 = cy+r*Math.sin((startAngle-90)*Math.PI/180);
    const x2 = cx+r*Math.cos((endAngle-90)*Math.PI/180);
    const y2 = cy+r*Math.sin((endAngle-90)*Math.PI/180);
    const large = (endAngle-startAngle)>180?1:0;
    paths += `<path d="M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2}" stroke="${s.color}" stroke-width="${r*.5}" fill="none"/>`;
    startAngle = endAngle;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${cx*2} ${cy*2}">${paths}</svg>`;
}

function miniBarChart(w=120,h=50,bars=[]) {
  const maxV = Math.max(...bars.map(b=>b.v));
  const bw = (w-10)/(bars.length*2);
  let rects = '';
  bars.forEach((b,i) => {
    const bh = (b.v/maxV)*(h-14);
    rects += `<rect x="${5+i*(bw*2)}" y="${h-4-bh}" width="${bw}" height="${bh}" rx="1" fill="${b.c}" opacity=".8"/>`;
    rects += `<text x="${5+i*(bw*2)+bw/2}" y="${h}" text-anchor="middle" font-size="4" fill="#999">${b.l}</text>`;
  });
  return `<svg width="${w}" height="${h}">${rects}</svg>`;
}

const frameContent = {
  'landing': () => `
    ${miniNav()}
    <div style="height:100px;background:linear-gradient(135deg,#1B263B,#2d4a6e);position:relative;overflow:hidden;">
      <div style="position:absolute;top:50%;left:12px;transform:translateY(-50%);">
        <div style="width:90px;height:5px;background:#fff;border-radius:2px;margin-bottom:4px;opacity:.9"></div>
        <div style="width:120px;height:4px;background:rgba(0,128,128,.7);border-radius:2px;margin-bottom:6px"></div>
        <div style="width:70px;height:3px;background:rgba(255,255,255,.3);border-radius:1px;margin-bottom:3px"></div>
        <div style="width:55px;height:3px;background:rgba(255,255,255,.2);border-radius:1px;margin-bottom:6px"></div>
        <div style="display:flex;gap:4px;">
          <div class="mini-btn" style="background:#008080;">Request Doc</div>
          <div class="mini-btn" style="background:rgba(255,255,255,.15);">Learn More</div>
        </div>
      </div>
      <div style="position:absolute;top:50%;right:12px;transform:translateY(-50%);display:flex;gap:4px;">
        <div style="width:26px;height:26px;border-radius:4px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:8px;">🌤</div>
        <div style="width:26px;height:26px;border-radius:4px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:6px;color:rgba(255,255,255,.5);">⏰</div>
      </div>
      <div style="position:absolute;right:20px;bottom:6px;width:80px;height:50px;background:rgba(255,255,255,.08);border-radius:6px;"></div>
    </div>
    <div style="padding:6px 10px;">
      <div style="display:flex;gap:6px;margin-bottom:6px;">
        <div class="mini-stat" style="flex:1"><div class="val">12.5K</div><div class="lbl">Residents</div></div>
        <div class="mini-stat" style="flex:1"><div class="val">142</div><div class="lbl">This Month</div></div>
        <div class="mini-stat" style="flex:1"><div class="val">7</div><div class="lbl">Puroks</div></div>
        <div class="mini-stat" style="flex:1"><div class="val">99%</div><div class="lbl">Satisfaction</div></div>
      </div>
      <div style="font-size:6px;color:#999;margin:4px 0;">Quick Services</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;">
        <div style="background:#f5f7fa;border-radius:4px;padding:4px;text-align:center;"><div style="font-size:10px;">📄</div><div style="font-size:4px;color:#666;">Documents</div></div>
        <div style="background:#f5f7fa;border-radius:4px;padding:4px;text-align:center;"><div style="font-size:10px;">🏥</div><div style="font-size:4px;color:#666;">Clinic</div></div>
        <div style="background:#f5f7fa;border-radius:4px;padding:4px;text-align:center;"><div style="font-size:10px;">⚠️</div><div style="font-size:4px;color:#666;">Report</div></div>
        <div style="background:#f5f7fa;border-radius:4px;padding:4px;text-align:center;"><div style="font-size:10px;">💰</div><div style="font-size:4px;color:#666;">Finance</div></div>
      </div>
    </div>
  `,

  'doc-form': () => `
    <div style="background:linear-gradient(135deg,rgba(27,38,59,.03),rgba(0,128,128,.03));padding:8px 10px;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <div style="font-size:8px;font-weight:600;color:#1B263B;font-family:Montserrat;">Document Request</div>
        <div style="margin-left:auto;display:flex;gap:3px;">
          ${[1,2,3,4,5].map((n,i)=>`<div style="width:14px;height:14px;border-radius:50%;font-size:5px;display:flex;align-items:center;justify-content:center;${i<2?'background:#008080;color:#fff;':'background:#e5e7eb;color:#999;'}">${n}</div>`).join('')}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;">
        <div><div style="font-size:4px;color:#999;margin-bottom:1px;">Full Name *</div><div class="mini-input"></div></div>

function getFrameRect(id) {
  const f = frames.find(f=>f.id===id);
  return f ? { x:f.x, y:f.y, w:f.w, h:f.h } : null;
}

function getPort(rect, side, port=.5) {
  switch(side) {
    case 'top': return { x:rect.x+rect.w*port, y:rect.y };
    case 'bottom': return { x:rect.x+rect.w*port, y:rect.y+rect.h };
    case 'left': return { x:rect.x, y:rect.y+rect.h*port };
    case 'right': return { x:rect.x+rect.w, y:rect.y+rect.h*port };
  }
}

function renderNoodles() {
  let svg = '';
  // Arrow marker
  svg += '<defs>';
  connections.forEach((c,i) => {
    svg += `<marker id="arrow${i}" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="${c.color}" opacity=".7"/></marker>`;
  });
  svg += '</defs>';

  connections.forEach((c,i) => {
    const fromRect = getFrameRect(c.from);
    const toRect = getFrameRect(c.to);
    if(!fromRect||!toRect) return;

    const fromP = getPort(fromRect, c.fromSide, c.fromPort||.5);
    const toP = getPort(toRect, c.toSide, c.toPort||.5);

    // Bezier control points
    let cx1, cy1, cx2, cy2;
    const dist = Math.hypot(toP.x-fromP.x, toP.y-fromP.y) * .4;

    if(c.fromSide==='bottom') { cx1=fromP.x; cy1=fromP.y+dist; }
    else if(c.fromSide==='top') { cx1=fromP.x; cy1=fromP.y-dist; }
    else if(c.fromSide==='right') { cx1=fromP.x+dist; cy1=fromP.y; }
    else { cx1=fromP.x-dist; cy1=fromP.y; }

    if(c.toSide==='top') { cx2=toP.x; cy2=toP.y-dist; }
    else if(c.toSide==='bottom') { cx2=toP.x; cy2=toP.y+dist; }
    else if(c.toSide==='left') { cx2=toP.x-dist; cy2=toP.y; }
    else { cx2=toP.x+dist; cy2=toP.y; }

    const dash = c.dashed ? 'stroke-dasharray="8 5"' : '';
    svg += `<path d="M${fromP.x},${fromP.y} C${cx1},${cy1} ${cx2},${cy2} ${toP.x},${toP.y}" stroke="${c.color}" stroke-width="2" ${dash} opacity=".55" marker-end="url(#arrow${i})"/>`;

    // Dot at start
    svg += `<circle cx="${fromP.x}" cy="${fromP.y}" r="3" fill="${c.color}" opacity=".7"/>`;

    // Label
    if(c.label) {
      const mx = (fromP.x+toP.x)/2;
      const my = (fromP.y+toP.y)/2;
      const lw = c.label.length*5+12;
      svg += `<rect x="${mx-lw/2}" y="${my-8}" width="${lw}" height="16" rx="4" fill="#161b22" stroke="${c.color}" stroke-width=".8" opacity=".9"/>`;
      svg += `<text x="${mx}" y="${my+3}" text-anchor="middle" class="noodle-label" fill="${c.color}">${c.label}</text>`;
    }
  });

  noodles.innerHTML = svg;
}
